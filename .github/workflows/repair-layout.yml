          ]''')
          root = Path.cwd()
          def blob_sha(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          
          restored = []
          for entry in entries:
              target = root / entry["path"]
              if target.is_file():
                  if blob_sha(target) == entry["sha"]:
                      continue
                  raise SystemExit("Existing file differs; preserve it and inspect before repair: " + entry["path"])
              source = root / target.name
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.is_file() and blob_sha(source) == entry["sha"]:
                  shutil.copyfile(source, target)
              elif "content" in entry:
                  target.write_text(entry["content"], encoding="utf-8")
              else:
                  raise SystemExit("Missing or changed source file for " + entry["path"] + ". Restore that file from the original source ZIP.")
              if blob_sha(target) != entry["sha"]:
                  raise SystemExit("Integrity check failed: " + entry["path"])
              restored.append(entry["path"])
          
          print("Verified all " + str(len(entries)) + " original files.")
          print("Restored " + str(len(restored)) + " paths; top-level uploads are retained.")
          for path in restored:
              print(path)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the pinned dependencies
        run: npm ci

      - name: Verify real MCP tool calls
        run: npm test

      - name: Run the five positive and three negative review cases
        run: npm run review

      - name: Commit the restored paths
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .gitignore api src data docs public scripts tests review plugin-template
          if git diff --cached --quiet
          then
            echo "Folder structure already complete; no new commit required."
            exit 0
          fi
          git commit -m "Restore MCP folder structure and missing server source"
          git push origin HEAD:main
