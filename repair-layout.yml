# Repairs the flattened upload for Mrshoaib011/mavixx-design-mcp.
# Copies existing uploaded bytes to their original paths; restores the four
# missing small source/configuration files. Leaves top-level uploads in place.
# Verifies all original Git blob hashes, runs MCP tests, then commits the paths.
name: Restore MCP folder structure

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-layout.yml"

permissions:
  contents: write

concurrency:
  group: mavixx-folder-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Restore and verify the original folder layout
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          
          entries = json.loads(r'''[
            {
              "path": ".env.example",
              "sha": "95d98baf159bf6ea9b79a0bd076319cda78bc9eb",
              "content": "# Set this to your actual production hostname, without https:// or a path.\nALLOWED_HOSTS=your-production-host.example\n# Copy the exact token from the OpenAI developer portal; leave empty until issued.\nOPENAI_APPS_CHALLENGE=\nPORT=3000\n"
            },
            {
              "path": ".gitignore",
              "sha": "a6a74cc50d70eabfe257abfc04d9035153b50052",
              "content": "node_modules/\n.vercel/\n.env*\n!.env.example\nrelease/\nreview/test-results.json\nreview/walkthrough.mp4\n"
            },
            {
