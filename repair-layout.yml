              "sha": "fa27833da0c5a6ba6ed083d072a509c600d4a799"
            },
            {
              "path": "plugin-template/.codex-plugin/plugin.json",
              "sha": "e2dcaf7909f6350ab44a48afd6828cbb19fdda3d",
              "content": "{\n  \"name\": \"mavixx-social-media-design\",\n  \"version\": \"2.0.0\",\n  \"description\": \"Search design templates and get branded social-post, carousel, flyer and campaign guidance through a remote MCP server.\",\n  \"keywords\": [\"graphic design\", \"social media\", \"carousels\", \"flyers\", \"templates\", \"campaign variations\"],\n  \"author\": { \"name\": \"Shoaib Akhtar\", \"url\": \"https://www.linkedin.com/in/mrcreatech/\" },\n  \"repository\": \"https://github.com/Mrshoaib011/Social-Media-Graphic-Design-Posts-Carousels-Flyers-Plugin-ChatGpt\",\n  \"mcpServers\": \"./.mcp.json\",\n  \"interface\": {\n    \"displayName\": \"Mavixx Social Media Design\",\n    \"shortDescription\": \"Posts, Carousels & Flyers\",\n    \"longDescription\": \"Find suitable design structures in a fixed catalog of 4,057 analyzed templates through a remote MCP server. Search categories, shortlist templates, inspect complete source guidance and obtain practical rules for social posts, carousels, stories, flyers, posters and logo concepts.\\n\\nTemplate selection follows category, subcategory, communication format, purpose, style and palette, with contextual ranking. Guidance preserves actual product/logo identity, uses a 60/30/10 color balance and an invisible thirds grid, and supports matching campaign variations with fresh creative copy and distinct main layouts. CTA, logo and fixed footer anchors stay in their approved positions.\\n\\nThe MCP server provides template data and design guidance. Final image creation requires the host image-generation capability. It does not render images, browse websites, read uploaded files, publish content or access accounts. Source analysis is supplied workbook text; original reference images are not included.\\n\\nNo sign-in is required for this public read-only catalog. Send only necessary short design descriptors. The application does not retain request bodies; hosting providers may process operational logs.\\n\\nThe original optional Creative Fabrica affiliate configuration is retained and disclosed in design guidance. Automatic recommendation display is suppressed because this anonymous stateless server cannot enforce private persistent per-user opt-out and the rolling 24-hour limit. No advertising-policy approval is claimed.\",\n    \"category\": \"Creativity\",\n    \"capabilities\": [\"Template search\", \"Design guidance\", \"Campaign variations\"],\n    \"defaultPrompt\": [\"Find a design structure for my social media post.\", \"Help me plan a branded flyer.\", \"Plan matching campaign variations for my product.\"],\n    \"brandColor\": \"#7C3AED\",\n    \"composerIcon\": \"./assets/logo.png\",\n    \"logo\": \"./assets/logo.png\",\n    \"developerName\": \"SHOAIB AKHTAR\"\n  },\n  \"extensions\": {\n    \"com.openai\": {\n      \"publication\": {\n        \"release_notes\": \"Version 2.0.0 introduces four bounded read-only remote MCP tools over all 4,057 source records: categories, contextual template search, full-record retrieval and design/campaign guidance. Keeps source provenance, identity rules, color/composition guidance and campaign anchors. Image rendering remains a host capability. No user accounts, writes, arbitrary URLs or request-body persistence. Affiliate configuration remains disclosed; automatic display is disabled without the required persistent per-user guard. This must be submitted as a new MCP-enabled store entry after hosting, domain verification and reviewer walkthrough preparation.\"\n      }\n    }\n  }\n}\n"
            },
            {
              "path": "plugin-template/assets/logo.png",
              "sha": "5c9758ab4fda5a6fef6b0ed4fc7c0b6797873016"
            },
            {
              "path": "public/index.html",
              "sha": "c6af2a76b1c9658aef6a585fa336efcd4570e722"
